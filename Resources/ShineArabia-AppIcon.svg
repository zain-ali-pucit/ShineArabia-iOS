<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>

    <!-- Background gradient: coral → amber (diagonal) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#F07B62"/>
      <stop offset="55%"  stop-color="#E8715A"/>
      <stop offset="100%" stop-color="#C97930"/>
    </linearGradient>

    <!-- Radial warmth glow at center -->
    <radialGradient id="iconGlow" cx="512" cy="490" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Star fill gradient -->
    <radialGradient id="starGrad" cx="512" cy="480" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE8DC" stop-opacity="0.94"/>
    </radialGradient>

    <!-- Soft glow behind star -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow for teal diamonds -->
    <filter id="diamondGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ── Badge background (iOS rounded square) ── -->
  <rect width="1024" height="1024" rx="230" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#iconGlow)"/>

  <!-- ── Subtle geometric rings ── -->
  <circle cx="512" cy="512" r="460"
          fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.07"/>
  <circle cx="512" cy="512" r="372"
          fill="none" stroke="#FFFFFF" stroke-width="1"   stroke-opacity="0.05"/>

  <!-- ══ Moorish Pointed Arch ══ -->

  <!--   Outer arch -->
  <path d="M 228,890
           L 228,556
           Q 228,168 512,112
           Q 796,168 796,556
           L 796,890"
        fill="rgba(255,255,255,0.10)"
        stroke="rgba(255,255,255,0.54)"
        stroke-width="6.5"
        stroke-linejoin="round"/>

  <!--   Inner arch (double portal frame) -->
  <path d="M 274,890
           L 274,572
           Q 274,222 512,170
           Q 750,222 750,572
           L 750,890"
        fill="none"
        stroke="rgba(255,255,255,0.24)"
        stroke-width="3.5"
        stroke-linejoin="round"/>

  <!--   Arch base line -->
  <line x1="176" y1="890" x2="848" y2="890"
        stroke="rgba(255,255,255,0.42)" stroke-width="6" stroke-linecap="round"/>

  <!--   Knobs at arch feet -->
  <circle cx="228" cy="890" r="24" fill="rgba(255,255,255,0.30)"/>
  <circle cx="796" cy="890" r="24" fill="rgba(255,255,255,0.30)"/>

  <!--   Finial jewel at arch crown -->
  <circle cx="512" cy="112" r="18" fill="rgba(255,255,255,0.55)"/>
  <circle cx="512" cy="112" r="9"  fill="#FFFFFF"/>

  <!-- ══ 4-Pointed Sparkle Star ══ -->
  <!--
    Center:  (512, 492)
    Outer radius (V & H): 226
    Inner waist at 45°:   64  →  64 × 0.707 ≈ 45
    Outer: top(512,266)  right(738,492)  bottom(512,718)  left(286,492)
    Inner: (557,447)  (557,537)  (467,537)  (467,447)
  -->
  <polygon
    points="512,266 557,447 738,492 557,537 512,718 467,537 286,492 467,447"
    fill="url(#starGrad)"
    filter="url(#starGlow)"/>

  <!-- ══ Teal Diamond Accents (×4 at 45° between rays) ══ -->
  <!--   Distance from center = 155  →  155 × 0.707 ≈ 110   -->
  <!--   Positions: (622,382)  (622,602)  (402,602)  (402,382)  -->
  <g fill="#2D8C7A" filter="url(#diamondGlow)">
    <!-- top-right  --> <polygon points="622,360 644,382 622,404 600,382"/>
    <!-- bottom-right --> <polygon points="622,580 644,602 622,624 600,602"/>
    <!-- bottom-left --> <polygon points="402,580 424,602 402,624 380,602"/>
    <!-- top-left   --> <polygon points="402,360 424,382 402,404 380,382"/>
  </g>

  <!-- ══ Scattered Mini Sparkles (atmosphere / depth) ══ -->
  <g fill="#FFFFFF">
    <!-- top-left 4-pointed mini star -->
    <polygon points="176,212 184,234 206,242 184,250 176,272 168,250 146,242 168,234"
             opacity="0.68"/>
    <!-- top-right 4-pointed mini star (smaller) -->
    <polygon points="850,192 856,208 872,214 856,220 850,236 844,220 828,214 844,208"
             opacity="0.52"/>
    <!-- bottom-left dot cluster -->
    <circle cx="150" cy="762" r="9"  opacity="0.42"/>
    <circle cx="174" cy="792" r="5"  opacity="0.28"/>
    <!-- bottom-right dot cluster -->
    <circle cx="874" cy="798" r="10" opacity="0.38"/>
    <circle cx="852" cy="772" r="5"  opacity="0.25"/>
    <!-- lone accent dots -->
    <circle cx="752" cy="146" r="6"  opacity="0.48"/>
    <circle cx="128" cy="448" r="5"  opacity="0.28"/>
    <circle cx="898" cy="500" r="4"  opacity="0.22"/>
  </g>

</svg>
